spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
slotq.auth.dev-bootstrap-enabled=false
slotq.cors.allowed-origins=
slotq.booking.hold-idempotency.cleanup-interval=PT1H
slotq.booking.hold-idempotency.cleanup-batch-size=1000
# Producer remains fail-closed without a ready integration provider and durable active route.
slotq.waitlist.promotion.enabled=false
slotq.events.delivery.scheduler-enabled=false
slotq.events.delivery.poll-interval=PT1S
slotq.events.delivery.max-attempts=5
slotq.events.delivery.lease=PT30S
slotq.events.delivery.effect-timeout=PT10S
slotq.events.delivery.lock-wait=PT5S
slotq.events.delivery.batch-size=100
slotq.events.delivery.retry-delays=PT1S,PT5S,PT30S,PT2M
