plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.slotq'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.0.1'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.0.1'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'slotq.test.runtime-classpath', sourceSets.test.runtimeClasspath.asPath
    systemProperty 'jdk.httpclient.disableRetryConnect', 'true'
    systemProperty 'jdk.httpclient.enableAllMethodRetry', 'false'
    systemProperty 'jdk.httpclient.redirects.retrylimit', '1'
    ['knowledgePython', 'knowledgeModel'].each { key ->
        if (project.hasProperty(key)) systemProperty "slotq.knowledge.${key == 'knowledgePython' ? 'python' : 'model'}", project.property(key)
    }
    if (project.hasProperty('secureFixture')) {
        systemProperty 'slotq.kafka.secure.fixture', project.property('secureFixture')
    }
    if (project.hasProperty('kafkaEvidenceDir')) {
        systemProperty 'slotq.kafka.evidence.dir', project.property('kafkaEvidenceDir')
    }
    if (project.hasProperty('kafkaEvidenceRevision')) {
        systemProperty 'slotq.kafka.evidence.revision', project.property('kafkaEvidenceRevision')
    }
    ['kafkaFaultBootstrap', 'kafkaFaultRunId', 'kafkaFaultEvidenceDir'].each { key ->
        if (project.hasProperty(key)) {
            systemProperty "slotq.fault.${key}", project.property(key)
        }
    }
}

tasks.register('validateM8Fixtures', JavaExec) {
    group = 'verification'
    description = 'Validates M8 synthetic fixtures and execution contracts offline; does not run or score evaluations.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.evaluation.M8FixtureValidator'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('m8Capacity', JavaExec) {
    group = 'verification'
    description = 'Opt-in open-loop mixed capacity diagnostic on disposable MySQL and HTTPS; incomplete observations never qualify support.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.mcp.M8CapacityRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    jvmArgs '-Xmx768m'
    ['stage', 'size', 'pool', 'seed', 'output', 'criteria'].each { key ->
        if (project.hasProperty("capacity${key.capitalize()}")) {
            systemProperty "slotq.capacity.${key}", project.property("capacity${key.capitalize()}")
        }
    }
    systemProperty 'jdk.httpclient.disableRetryConnect', 'true'
    systemProperty 'jdk.httpclient.enableAllMethodRetry', 'false'
    systemProperty 'jdk.httpclient.redirects.retrylimit', '1'
}

tasks.register('m8CapacityRecalculate', JavaExec) {
    group = 'verification'
    description = 'Verifies a mixed-load raw digest and recalculates its saved summary without Docker or provider access.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.mcp.M8CapacityEvidence'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'slotq.capacity.input', project.findProperty('capacityInput') ?: ''
    systemProperty 'slotq.capacity.digest', project.findProperty('capacityDigest') ?: ''
}

tasks.register('m8Evaluate', Test) {
    group = 'verification'
    description = 'Runs offline M8 scorer test vectors and emits a protected 60-cell report; no model or Product qualification.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.slotq.evaluation.M8EvaluationTests.deterministicDatasetReportAndOfflineRecalculationPreserveAllSixtyCells' }
    outputs.upToDateWhen { false }
}

tasks.register('m8Recalculate', JavaExec) {
    group = 'verification'
    description = 'Recalculates sealed M8 evidence offline, preserving the original report and evidence lane.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.evaluation.M8Evaluation'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'slotq.m8.runId', project.findProperty('m8RunId') ?: ''
    systemProperty 'slotq.m8.digest', project.findProperty('m8Digest') ?: ''
    systemProperty 'slotq.m8.reviews', project.findProperty('m8Reviews') ?: ''
    systemProperty 'slotq.m8.reviewDigest', project.findProperty('m8ReviewDigest') ?: ''
}

def m8ModelProperties = { task ->
    ['modelPlan', 'modelPlanDigest', 'modelOptIn', 'modelFreeTier', 'modelPaidCalls'].each { key ->
        task.systemProperty "slotq.m8.${key}", project.findProperty("m8${key.capitalize()}") ?: ''
    }
    task.systemProperty 'jdk.httpclient.disableRetryConnect', 'true'
    task.systemProperty 'jdk.httpclient.enableAllMethodRetry', 'false'
    task.systemProperty 'jdk.httpclient.redirects.retrylimit', '1'
    task.doFirst {
        if (project.findProperty('m8ModelOptIn') != 'true' || project.findProperty('m8ModelFreeTier') != 'true'
                || project.findProperty('m8ModelPaidCalls') != 'false' || !project.hasProperty('m8ModelPlanDigest')) {
            throw new GradleException('Explicit bounded free-only M8 provider opt-in and plan digest required')
        }
    }
}

tasks.register('m8ModelFixture', JavaExec) {
    group = 'verification'
    description = 'Opt-in M8 repeated actual-provider fixture lane using the existing single-attempt adapter and scorer.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.evaluation.M8ActualProvider'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    m8ModelProperties(delegate)
}

tasks.register('m8ModelRuntime', Test) {
    group = 'verification'
    description = 'Opt-in M8 repetition through existing production Runtime/MCP/Product/Knowledge; Router remains authoritative.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.slotq.mcp.RepresentativeFlowIntegrationTests.m8ActualProviderRepeatedRuntime' }
    m8ModelProperties(delegate)
    outputs.upToDateWhen { false }
}

tasks.register('m8RuntimeEvaluation', Test) {
    group = 'verification'
    description = 'Connects deterministic M8 evaluation to the existing Runtime/MCP/Product HTTPS/MySQL and lexical retrieval fixtures.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.slotq.mcp.RepresentativeFlowIntegrationTests.m8EvaluationConnectsRuntimeProductAndIndependentMySqlObservations'
        includeTestsMatching 'com.slotq.mcp.RepresentativeFlowIntegrationTests.m8PreProviderAnswerFailureKeepsProductAndDoesNotReuseInitialProposal'
        includeTestsMatching 'com.slotq.mcp.KnowledgeRetrievalIntegrationTests.m8EvaluationConnectsCanonicalLexicalRetrievalAndPublicationEvidence'
    }
    systemProperty 'jdk.httpclient.disableRetryConnect', 'true'
    systemProperty 'jdk.httpclient.enableAllMethodRetry', 'false'
    systemProperty 'jdk.httpclient.redirects.retrylimit', '1'
    outputs.upToDateWhen { false }
}

// A fresh result directory prevents an earlier successful JUnit file from filling a missing case.
def securityExecutionId = UUID.randomUUID().toString()
def securityJUnit = layout.buildDirectory.dir("m8-security-junit/${securityExecutionId}")
tasks.register('m8SecurityRegression', Test) {
    group = 'verification'
    description = 'Runs the required synthetic security cases with real Auth/MCP/Product/Knowledge and disposable MySQL; no external model calls.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    def catalog = new groovy.json.JsonSlurper().parse(file('src/test/resources/evaluation/security-v1/cases.json'))
    filter {
        catalog.cases.collectMany { it.tests }.unique().each { includeTestsMatching it }
    }
    reports.junitXml.outputLocation = securityJUnit
    systemProperty 'jdk.httpclient.disableRetryConnect', 'true'
    systemProperty 'jdk.httpclient.enableAllMethodRetry', 'false'
    systemProperty 'jdk.httpclient.redirects.retrylimit', '1'
    outputs.upToDateWhen { false }
    finalizedBy 'm8SecurityReport'
}

tasks.register('m8SecurityReport', JavaExec) {
    group = 'verification'
    description = 'Generates the required security coverage report in the M8 result format; missing/skipped observations are INCOMPLETE.'
    mustRunAfter 'm8SecurityRegression'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.evaluation.M8SecurityRegression'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'slotq.security.junit', securityJUnit.get().asFile.absolutePath
}

tasks.register('representativeFlowEvidence', Test) {
    group = 'verification'
    description = 'Opt-in fresh free-tier provider through the production Runtime, MCP/Product/Knowledge and disposable MySQL.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.slotq.mcp.RepresentativeFlowIntegrationTests.actualProviderFlows' }
    systemProperty 'jdk.httpclient.disableRetryConnect', 'true'
    systemProperty 'jdk.httpclient.enableAllMethodRetry', 'false'
    systemProperty 'jdk.httpclient.redirects.retrylimit', '1'
    ['optIn', 'freeTier', 'paidCalls', 'output', 'flow'].each { key ->
        systemProperty "slotq.flowEvidence.${key}", project.findProperty("flowEvidence${key.capitalize()}") ?: (key == 'output' ? 'representative-flow-v6' : 'false')
    }
    doFirst {
        if (project.findProperty('flowEvidenceOptIn') != 'true' || project.findProperty('flowEvidenceFreeTier') != 'true'
                || project.findProperty('flowEvidencePaidCalls') != 'false') {
            throw new GradleException('Explicit free-only integrated provider opt-in required')
        }
        if (!(project.findProperty('flowEvidenceFlow') in ['customer', 'management', 'ops'])) {
            throw new GradleException('Select exactly one representative flow: customer, management or ops')
        }
    }
    outputs.upToDateWhen { false }
}

tasks.register('representativeFlowRecalculate', JavaExec) {
    group = 'verification'
    description = 'Recalculate the bounded integrated flow records, content review and actual Run routing without provider access.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.ai.router.RepresentativeFlowEvidence'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'slotq.flowEvidence.recalculate', 'true'
    systemProperty 'slotq.flowEvidence.output', project.findProperty('flowEvidenceOutput') ?: 'representative-flow-v6'
    systemProperty 'slotq.flowEvidence.flow', project.findProperty('flowEvidenceFlow') ?: ''
}

tasks.register('modelComparison', JavaExec) {
    group = 'verification'
    description = 'Opt-in free-tier actual Gemini comparison with synthetic fixtures, or offline evidence recalculation.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.ai.router.ModelComparisonRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'jdk.httpclient.disableRetryConnect', 'true'
    systemProperty 'jdk.httpclient.enableAllMethodRetry', 'false'
    systemProperty 'jdk.httpclient.redirects.retrylimit', '1'
    systemProperty 'slotq.modelComparison.gradleVersion', gradle.gradleVersion
    ['optIn', 'freeTier', 'paidCalls', 'recalculate'].each { key ->
        systemProperty "slotq.modelComparison.${key}", project.findProperty("modelComparison${key.capitalize()}") ?: 'false'
    }
    ['profile', 'output'].each { key ->
        if (project.hasProperty("modelComparison${key.capitalize()}")) {
            systemProperty "slotq.modelComparison.${key}", project.property("modelComparison${key.capitalize()}")
        }
    }
}

tasks.register('observabilityEvidence', JavaExec) {
    group = 'verification'
    description = 'Exercises Product HTTP, DB delivery, authenticated metrics, alerts and OTLP on disposable containers.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.ObservabilityEvidenceRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    if (project.hasProperty('output')) systemProperty 'slotq.observability.output', project.property('output')
}

tasks.register('eventExperiment', JavaExec) {
    group = 'verification'
    description = 'Compares test-only event boundaries on MySQL 8.4, including child JVM crashes.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.experiments.events.EventExperimentRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'slotq.events.gradleVersion', gradle.gradleVersion
    if (project.hasProperty('output')) {
        systemProperty 'slotq.events.output', project.property('output')
    }
}

tasks.register('eventProcessRecovery', JavaExec) {
    group = 'verification'
    description = 'Runs the production event delivery process crash/restart recovery matrix on MySQL 8.4.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.experiments.events.EventProcessRecoveryRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'slotq.events.gradleVersion', gradle.gradleVersion
    if (project.hasProperty('output')) {
        systemProperty 'slotq.events.recovery.output', project.property('output')
    }
    if (project.hasProperty('runId')) {
        systemProperty 'slotq.events.recovery.runId', project.property('runId')
    }
    if (project.hasProperty('only')) {
        systemProperty 'slotq.events.recovery.only', project.property('only')
    }
}

tasks.register('waitlistProcessRecovery', JavaExec) {
    group = 'verification'
    description = 'Runs real Booking/Waitlist child-JVM recovery and MySQL outage evidence.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.experiments.waitlist.WaitlistProcessRecoveryRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'slotq.recovery.gradleVersion', gradle.gradleVersion
    ['output', 'only'].each { key ->
        if (project.hasProperty(key)) systemProperty "slotq.waitlist.recovery.${key}", project.property(key)
    }
}

tasks.register('waitlistBaseline', JavaExec) {
    group = 'verification'
    description = 'Measures the real M4 Product workload with one DB direct worker on MySQL 8.4.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.experiments.waitlist.WaitlistBaselineRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'slotq.waitlist.baseline.gradleVersion', gradle.gradleVersion
    ['output', 'seed', 'recalculate'].each { key ->
        if (project.hasProperty(key)) systemProperty "slotq.waitlist.baseline.${key}", project.property(key)
    }
}

tasks.register('m5TransportComparison', JavaExec) {
    group = 'verification'
    description = 'Repeats the #105 public-command workload with two scoped consumers over DB direct and Kafka.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.experiments.waitlist.M5TransportComparisonRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    jvmArgs '-Xmx768m'
    systemProperty 'slotq.waitlist.baseline.gradleVersion', gradle.gradleVersion
    ['output', 'only', 'repeats', 'recalculate', 'hostStorage'].each { key ->
        if (project.hasProperty(key)) systemProperty "slotq.m5.${key}", project.property(key)
    }
}

tasks.register('m5CanonicalEvidence', JavaExec) {
    group = 'verification'
    description = 'Exports lossless canonical raw row versions and verifies summaries without duplicate dumps/logs.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.experiments.waitlist.M5CanonicalEvidence'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    ['input', 'export', 'recalculate'].each { key ->
        if (project.hasProperty(key)) systemProperty "slotq.m5.${key}", project.property(key)
    }
}

tasks.register('m5OperationsDrill', JavaExec) {
    group = 'verification'
    description = 'Runs fresh independent-role fault/recovery, protected HTTPS operator and Prometheus alert integration.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.experiments.waitlist.M5OperationsDrillRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    jvmArgs '-Xmx768m'
    ['output', 'recalculate'].each { key ->
        if (project.hasProperty(key)) systemProperty "slotq.m5.${key}", project.property(key)
    }
}

tasks.register('concurrencyBaseline', JavaExec) {
    group = 'verification'
    description = 'Runs the MySQL 8.4 Product HOLD concurrency baseline.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slotq.experiments.concurrency.ConcurrencyBaselineRunner'

    [
        'clients', 'iterations', 'seed', 'partySize', 'holdDuration', 'timeout',
        'output', 'strategy', 'hostCpuModel', 'hostStorage', 'containerLimits',
        'networkCondition'
    ].each { key ->
        if (project.hasProperty(key)) {
            systemProperty "slotq.baseline.${key}", project.property(key)
        }
    }
    systemProperty 'slotq.baseline.gradleVersion', gradle.gradleVersion
}
