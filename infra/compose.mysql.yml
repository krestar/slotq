services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: slotq
    ports:
      - "127.0.0.1:${SLOTQ_MYSQL_PORT:-3306}:3306"
    volumes:
      - slotq-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  slotq-mysql-data:
