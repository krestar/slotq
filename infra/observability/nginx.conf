events {}
http {
  access_log off;
  error_log /dev/stderr crit;
  server {
    listen 4318;
    client_max_body_size 2m;
    location = /v1/traces {
      limit_except POST { deny all; }
      auth_basic "SlotQ telemetry ingest";
      auth_basic_user_file /run/secrets/trace.htpasswd;
      proxy_set_header Authorization "";
      proxy_pass http://tempo:4318;
    }
    location / { return 404; }
  }
}
