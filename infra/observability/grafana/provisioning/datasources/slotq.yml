apiVersion: 1
datasources:
  - name: SlotQ metrics
    uid: slotq-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    basicAuth: true
    basicAuthUser: telemetry
    secureJsonData:
      basicAuthPassword: $METRICS_PASSWORD
    editable: false
  - name: SlotQ traces
    uid: slotq-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
