services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.config.file=/run/secrets/prometheus-web.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/.local:/run/secrets:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
  tempo:
    # v2 single binary has no Kafka dependency; this is a local evidence stack.
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
  trace-ingress:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:4318:4318"]
    volumes:
      - ./observability/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./observability/.local/trace.htpasswd:/run/secrets/trace.htpasswd:ro
    depends_on: [tempo]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: operator
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run observability/setup.ps1 first}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_EXPLORE_ENABLED: "true"
      METRICS_PASSWORD: ${METRICS_PASSWORD:?Run observability/setup.ps1 first}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo]
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
