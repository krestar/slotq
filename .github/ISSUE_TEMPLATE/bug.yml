name: 버그

description: 재현 가능한 SlotQ 오류를 기록합니다.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Secret, API Key, 토큰, 비밀번호, 개인정보가 포함된 로그는 첨부하지 마세요.

  - type: textarea
    id: background
    attributes:
      label: 목적 / 배경
      description: 무엇이 잘못됐고 왜 수정이 필요한지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 기대 결과 / 실제 결과
      placeholder: |
        기대: ...
        실제: ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 수정 완료를 확인할 수 있는 조건을 적어 주세요.
      placeholder: |
        - [ ] 동일 입력에서 문제가 재현되지 않는다.
        - [ ] 회귀 테스트가 추가된다.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위
      description: 이번 수정에서 의도적으로 하지 않는 작업이 있다면 적어 주세요.

  - type: textarea
    id: notes
    attributes:
      label: 참고사항
      description: 비식별 로그, 관련 ADR/Issue, 환경 등 필요한 정보만 적어 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 중복 Issue가 없는지 확인했습니다.
          required: true
        - label: Secret과 민감정보를 제거했습니다.
          required: true
