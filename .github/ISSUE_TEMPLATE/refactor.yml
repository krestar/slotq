name: 리팩터링

description: 외부 동작을 유지하면서 구조와 유지보수성을 개선합니다.
title: "[Refactor] "
labels: ["type:refactor"]
body:
  - type: textarea
    id: background
    attributes:
      label: 목적 / 배경
      description: 현재 구조의 문제와 변경이 필요한 이유를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 변경할 책임, 경계, 모듈을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: 반드시 유지할 동작
      description: 리팩터링 전후로 바뀌면 안 되는 API, 도메인 규칙, 데이터 계약을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 테스트와 검증을 포함한 완료 조건을 적어 주세요.
      placeholder: |
        - [ ] 기존 동작을 검증하는 테스트가 통과한다.
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: 기능 추가 등 이번 리팩터링과 분리할 작업을 적어 주세요.

  - type: textarea
    id: notes
    attributes:
      label: 참고사항
      description: 관련 Issue, ADR, 단계적 변경 계획 등이 있다면 적어 주세요.
