name: PR Policy

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: slotq-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate PR title, branch and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          author = os.environ.get("PR_AUTHOR", "")
          title = os.environ.get("PR_TITLE", "")
          body = os.environ.get("PR_BODY", "")
          head = os.environ.get("PR_HEAD", "")

          if author == "dependabot[bot]":
              print("Dependabot PR: repository title/body policy validation skipped.")
              sys.exit(0)

          errors = []

          title_pattern = re.compile(
              r"^(feat|fix|refactor|test|docs|chore|build|ci|perf)\([a-z0-9][a-z0-9._-]*\): .+$"
          )
          if not title_pattern.match(title):
              errors.append(
                  "PR 제목은 'type(scope): 한글 제목' 형식이어야 합니다. "
                  "예: feat(reservation): 예약 HOLD 기능 추가"
              )
          elif not re.search(r"[가-힣]", title):
              errors.append("PR 제목의 설명 부분에는 자연스러운 한국어를 포함해 주세요.")

          branch_pattern = re.compile(
              r"^(feat|fix|refactor|test|docs|chore|build|ci|perf)/[a-z0-9][a-z0-9._-]*$"
          )
          if not branch_pattern.match(head):
              errors.append(
                  "브랜치 이름은 '<type>/<purpose>' 형식이어야 합니다. "
                  "예: feat/reservation-hold"
              )

          required_sections = [
              "## 왜 필요한가요?",
              "## 변경 내용",
              "## 검증",
              "## 관련 Issue",
              "## 보안·데이터 영향",
          ]
          for section in required_sections:
              if section not in body:
                  errors.append(f"PR 본문에 필수 섹션이 없습니다: {section}")

          if "Closes #" not in body and "Fixes #" not in body:
              errors.append("PR 본문에서 관련 Issue를 'Closes #번호' 또는 'Fixes #번호'로 연결해 주세요.")

          if errors:
              print("PR policy validation failed:\n")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("PR metadata validation passed.")
          PY

  changes:
    name: Detect verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed verification scopes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, head],
              text=True,
          ).splitlines()

          backend = any(
              path.startswith("backend/")
              or path == ".github/workflows/backend-ci.yml"
              or path == ".github/workflows/pr-policy.yml"
              for path in changed
          )
          frontend = any(
              path.startswith("frontend/")
              or path == ".github/workflows/frontend-ci.yml"
              or path == ".github/workflows/pr-policy.yml"
              for path in changed
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"backend={str(backend).lower()}\n")
              output.write(f"frontend={str(frontend).lower()}\n")

          print("Changed files:")
          for path in changed:
              print(f"- {path}")
          print(f"backend={backend}, frontend={frontend}")
          PY

  backend:
    name: Backend verification
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend verification
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [metadata, changes, backend, frontend]

    steps:
      - name: Require metadata and applicable verification
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          failures = []

          if os.environ["METADATA_RESULT"] != "success":
              failures.append(f"PR metadata: {os.environ['METADATA_RESULT']}")
          if os.environ["CHANGES_RESULT"] != "success":
              failures.append(f"verification scope detection: {os.environ['CHANGES_RESULT']}")

          for name in ("BACKEND", "FRONTEND"):
              required = os.environ[f"{name}_REQUIRED"] == "true"
              result = os.environ[f"{name}_RESULT"]
              if required and result != "success":
                  failures.append(f"{name.lower()} verification: {result}")
              if not required and result not in ("skipped", "success"):
                  failures.append(f"unexpected {name.lower()} verification result: {result}")

          if failures:
              print("Required PR verification failed:")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print("PR policy and all applicable verification passed.")
          PY
